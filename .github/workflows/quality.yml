name: Quality checks

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # package-lock.json is currently from an older Next patch version than
      # package.json. Production already installs with npm install, so CI uses
      # the same resolution path until the lockfile is regenerated.
      - run: npm install --no-audit --no-fund
      - run: npm run build

  backend-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run Promo Studio smoke flow
        working-directory: backend
        shell: bash
        run: |
          set +e
          PYTHONPATH=. python tests/smoke.py 2>&1 | tee smoke.log
          status=${PIPESTATUS[0]}
          exit $status
      - name: Upload smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-smoke-log
          path: backend/smoke.log
          if-no-files-found: warn
          retention-days: 3
